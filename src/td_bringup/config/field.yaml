# ЕДИНСТВЕННЫЙ источник правды о поле.
#
# На площадке правится только этот файл — код трогать не нужно. Его читают все
# ноды системы: сетка, привязка координат, ограничения поиска, ID меток.
#
# Система координат (см. td_world/grid.py):
#   строки A..F — сверху вниз по фотографии поля,
#   столбцы 1..6 — слева направо,
#   начало field-фрейма — внешний угол клетки F1 (левый нижний),
#   ось x растёт с номером столбца, ось y — от F к A, z вверх.

field:
  # --- геометрия ---------------------------------------------------------
  rows: 6
  cols: 6
  cell_size_m: 0.8              # клетка 80x80 см -> поле 4.8x4.8 м

  # --- сценарий ----------------------------------------------------------
  start_cell: F1                # стартовая клетка ровера (уточнить на площадке)

  # Клетки, в которых может стоять игрушка. Организаторы обещали 2 или 3 —
  # список можно расширить, ничего больше менять не нужно.
  target_candidates: [A1, E2]

  # Клетки, где ожидается бумажка с финишем (обычно там же, где игрушка).
  label_cells: [A1, E2]

  # --- привязка к роботам ------------------------------------------------
  # Получается процедурой калибровки:
  #   ros2 run td_bringup calibrate_field --pair F1 0.12 0.34 --pair A6 3.9 4.2
  # Значения: сдвиг x, сдвиг y (м) и поворот yaw (рад) поля в системе робота.
  field_to_map: {x: 0.0405, y: -0.1872, yaw: 0.03702}      # карта ровера (SLAM/AMCL)
  field_to_drone: {x: 0.0, y: 0.0, yaw: 0.0}    # локальный фрейм дрона

  # --- маркеры -----------------------------------------------------------
  markers:
    own_ids: [7]                # ArUco на нашем ровере
    enemy_ids: [11]             # ArUco на ровере противника
    size_m: 0.1
